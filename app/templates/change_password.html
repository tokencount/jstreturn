<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>更改密码 · jstreturn</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #f1f5f9; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { width: 100%; max-width: 25rem; background: #fff; border-radius: 1rem; padding: 1.75rem; box-shadow: 0 1px 3px #0001; }
    h1 { margin: 0 0 .5rem; font-size: 1.35rem; }
    p { color: #64748b; font-size: .88rem; }
    label { display: block; margin: 1rem 0 .25rem; font-size: .85rem; }
    input { width: 100%; padding: .7rem; border: 1px solid #cbd5e1; border-radius: .5rem; font-size: 1rem; }
    button { width: 100%; margin-top: 1.25rem; padding: .8rem; border: 0; border-radius: .5rem; background: #2563eb; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { background: #94a3b8; }
    #error { color: #b91c1c; min-height: 1.2rem; }
  </style>
</head>
<body>
  <main>
    <h1>更改密码</h1>
    <p>首次登录必须设置个人密码。设置后，初始 Token 立即失效。</p>
    <form id="form">
      <label for="current">当前 Token / 密码</label>
      <input id="current" type="password" autocomplete="current-password" required />
      <label for="next">新密码（10–128 字符）</label>
      <input id="next" type="password" autocomplete="new-password" minlength="10" maxlength="128" required />
      <label for="confirm">确认新密码</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required />
      <p id="error" role="alert"></p>
      <button id="submit" type="submit">保存密码并进入系统</button>
    </form>
  </main>
  <script>
    (async () => {
      const r = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
      if (!r.ok) window.location.replace('/login');
    })().catch(() => window.location.replace('/login'));
    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const current = document.getElementById('current').value;
      const next = document.getElementById('next').value;
      const confirm = document.getElementById('confirm').value;
      const error = document.getElementById('error');
      const button = document.getElementById('submit');
      error.textContent = '';
      if (next !== confirm) { error.textContent = '两次新密码不一致'; return; }
      button.disabled = true;
      try {
        const r = await fetch('/api/auth/change-password', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current_password: current, new_password: next }),
        });
        if (!r.ok) {
          const body = await r.json();
          throw new Error(body.detail || '更改失败');
        }
        window.location.replace('/');
      } catch (e) {
        error.textContent = e.message || '网络错误';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
